[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."send-reminders"]
  schedule = "0 * * * *"

[[redirects]]
  from = "/cancel/:token"
  to = "/.netlify/functions/cancel-registration?token=:token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Turvaheaderit. Julkista ilmoittautumissivua ei estetä iframelta, jotta
# seurat voivat upottaa sen omille sivuilleen; admin ja peruutus estetään.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/cancel/*"
  [headers.values]
    X-Frame-Options = "DENY"
